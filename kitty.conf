font_size 11


disable_ligatures always


cursor_shape block


enable_audio_bell no


remember_window_size  no
# initial_window_width  640
# initial_window_height 400


# BEGIN_KITTY_THEME
# One Dark
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
